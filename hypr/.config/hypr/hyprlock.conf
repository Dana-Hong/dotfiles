background {
    monitor =
    path = /home/dana/wallpapers/pc7_forest.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
    brightness = 2.2
}

# DATE
label {
    monitor = DP-1
    size = 30, 30
    color = rgba(220, 220, 220, 0.85) # no fill
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    border_color = rgba(0, 207, 230, 1.0)
    font_size = 25
    font_family = Iosevka Nerd Font

    position = 0, -210
    halign = center
    valign = center
}                                        

# TIME
label {
    monitor = DP-1
    size = 30, 30
    color = rgba(220, 220, 220, 0.85) # no fill
    text = $TIME12
    border_color = rgba(0, 207, 230, 1.0)
    font_size = 60
    font_family = Iosevka Nerd Font

    position = 0, -130
    halign = center
    valign = center
}                                        

image {
    monitor = DP-1
    size = 450
    path = /home/dana/wallpapers/Digital_Blue_Flowers_PNG - 1500x1500.png
    zindex = 2
    border_color = rgba(0, 0, 0, 0.0)
    shadow_passes = 1

    position = 0, 200
    halign = center
    valign = center
}

shape {
    monitor = DP-1
    size = 450
    zindex = 1
    border_color = rgba(0, 0, 0, 0.1)

    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 500, 500
    outline_thickness = 10
    inner_color = rgba(0, 0, 0, 0.25) # no fill
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = -1
    hide_input = true
    placeholder_text = 
    fail_text = 
    fail_timeout = 1000
    dots_size = 0.2

    position = 0, 200
    halign = center
    valign = center
}

