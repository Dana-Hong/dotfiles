# Tracked fallback used until Matugen generates a runtime palette.
palette = "matugen"

format = """
[](fg:background)\
[  ](bg:background fg:primary)\
$directory\
[ ](fg:background)\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
$python\
$time\
\n$character"""

[palettes.matugen]
background = "#18111a"
foreground = "#ecdeec"
primary = "#ecb2ff"
primary_container = "#74009f"
on_primary_container = "#f8d8ff"
secondary_container = "#5b3d58"
on_secondary_container = "#ffd6f8"
tertiary_container = "#673755"
on_tertiary_container = "#ffd8eb"
error = "#ffb4ab"

[directory]
style = "fg:foreground bg:background"
format = "[ $path]($style)"
truncation_length = 10
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
format = "[](fg:primary_container)[ $symbol $branch](fg:on_primary_container bg:primary_container)"

[git_status]
up_to_date = "✓"
format = "[ $all_status$ahead_behind ](fg:on_primary_container bg:primary_container)[ ](fg:primary_container)"

[nodejs]
symbol = ""
format = "[](fg:secondary_container)[ $symbol ($version) ](fg:on_secondary_container bg:secondary_container)[ ](fg:secondary_container)"

[rust]
symbol = ""
format = "[](fg:secondary_container)[ $symbol ($version) ](fg:on_secondary_container bg:secondary_container)[ ](fg:secondary_container)"

[golang]
symbol = ""
format = "[](fg:secondary_container)[ $symbol ($version) ](fg:on_secondary_container bg:secondary_container)[ ](fg:secondary_container)"

[php]
symbol = ""
format = "[](fg:secondary_container)[ $symbol ($version) ](fg:on_secondary_container bg:secondary_container)[ ](fg:secondary_container)"

[python]
symbol = "🐍"
format = "[](fg:secondary_container)[ $symbol ($version) ](fg:on_secondary_container bg:secondary_container)[ ](fg:secondary_container)"

[time]
disabled = false
time_format = "%l:%M %p"
format = "[](fg:tertiary_container)[   $time ](fg:on_tertiary_container bg:tertiary_container)[ ](fg:tertiary_container)"

[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold primary)"
